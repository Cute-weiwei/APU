services:
  redroid:
    image: erstt/redroid:11.0.0_ndk_ChromeOS
    privileged: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - /dev/binderfs:/dev/binderfs
      - redroid-data:/data
    command:
      - androidboot.hardware=redroid
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=1
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    depends_on:
      - redroid
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APU_WEB_DATA_DIR: /data
      APU_WEB_HOST: 0.0.0.0
      APU_WEB_PORT: "8080"
      APU_WEB_ADMIN_USER: ${APU_WEB_ADMIN_USER:-admin}
      APU_WEB_ADMIN_PASSWORD: ${APU_WEB_ADMIN_PASSWORD:-change-me}
      APU_WEB_SERIAL: redroid:5555
      APU_REDROID_ADDR: redroid:5555
      APU_FRIDA: /opt/venv/bin/frida
      APU_FRIDA_PS: /opt/venv/bin/frida-ps
      APU_FRIDA_SERVER: /opt/apk-tools/frida-server
      APU_JADX_JAR: /opt/apk-tools/jadx/lib/jadx-gui-1.5.5-all.jar
      APU_JAVA: /usr/bin/java
      # Model providers can also be configured from the admin UI
      # (URL + API key + protocol + model + context). These env values only
      # seed providers on first start; existing providers are not overwritten.
      # DEEPSEEK_API_KEY: ""
      # DEEPSEEK_BASE_URL: "https://api.deepseek.com"
      # DEEPSEEK_MODEL: "deepseek-chat"
      # DEEPSEEK_ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic"
      # DEEPSEEK_ANTHROPIC_MODEL: "deepseek-chat"
      # ANTHROPIC_API_KEY: ""
      # ANTHROPIC_BASE_URL: "https://api.anthropic.com"
      # CLAUDE_MODEL: "claude-sonnet-5"
    volumes:
      - apu-data:/data

volumes:
  redroid-data:
  apu-data:
