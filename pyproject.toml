[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apk-unpack-agents"
version = "0.1.0"
description = "REA-style Android APK shell-unpacking agent: CLI, MCP server, and agent skill."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "apk-unpack-agents" }]
keywords = ["android", "apk", "unpack", "frida", "mcp", "reverse-engineering", "agents"]
dependencies = []

[project.scripts]
apk-unpack = "apk_unpack.cli:main"
apu = "apk_unpack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apk_unpack = ["scripts/*.js"]
